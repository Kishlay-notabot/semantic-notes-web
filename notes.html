const capture = () => $('#capture');

function autoGrowCapture() {
  const ta = capture();
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = Math.min(154, Math.max(24, ta.scrollHeight)) + 'px';
  $('#sendBtn').disabled = !ta.value.trim(); $('#pasteBtn')?.classList.toggle('hidden', !!ta.value.trim());
}

async function saveFromDock() {
  const ta = capture();
  if (!ta) return;
  const text = ta.value;
  if (!text.trim()) return;
  ta.value = '';
  autoGrowCapture();
  const note = await createNote(text);
  if (note) showToast('Note saved.');
}

document.addEventListener('click', async (e) => {
  if (e.target.closest('a[href]')) return;
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    const action = actionEl.dataset.action;
    const handlers = {
      'close-modal': () => { if (editingId != null && $('#editorText')) saveEditor(); else closeModal(); },
      'open-settings-model': () => openSettings('model'),
      'download-model': () => loadModel({ device: null, dtype: null }),
      'delete-model': () => confirmDialog({
        title: 'Delete the model?',
        message: 'The download is removed from this browser. Your notes and tags stay. You can download it again later.',
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: deleteModel,
      }),
      'pause-index': pauseIndexing,
      'resume-index': resumeIndexing,
      'retry-failed': retryFailed,
      'index-unindexed': indexUnindexed,
      'reindex-all': reindexAll,
      'retag-all': retagAllNotes,
      'open-tags': openTagsPanel,
      'manage-tags': openTagsPanel,
      'open-tag-drawer': openTagDrawer,
      'close-tag-drawer': closeTagDrawer,
      'new-tag': () => startTagEdit(null),
      'save-tag-form': saveTagForm,
      'cancel-tag-form': () => { tagForm = null; refreshTagPanel(); },
      'start-using': startUsing,
      'filter-all': () => {
        selectedTagId = null;
        renderTagbar();
        renderList();
        refreshTagPanel();
      },
      'toggle-sidebar': toggleSidebar,
      'export-json': exportJson,
      'export-markdown': exportMarkdown,
      'import-json': () => $('#importFile')?.click(),
      'clear-all': clearAllData,
      'reset-user': resetUser,
      'editor-save': saveEditor,
      'editor-delete': () => {
        if (editingId == null) return;
        deleteWithUndo(editingId);
      },
      'editor-pin': () => {
        if (editingId == null) return;
        togglePin(editingId);
        updateEditorMeta();
      },
      'editor-copy': async () => {
        const ta = $('#editorText');
        if (!ta) return;
        try {
          await navigator.clipboard.writeText(ta.value);
          showToast('Copied to clipboard.');
        } catch {
          ta.select();
          showToast('Press ⌘C / Ctrl+C to copy.');
        }
      },
    };
    if (handlers[action]) {
      e.preventDefault();
      handlers[action]();
      return;
    }
  }

  const pinBtn = e.target.closest('[data-pin-note]');
  if (pinBtn) {
    e.preventDefault();
    togglePin(Number(pinBtn.dataset.pinNote));
    return;
  }

  const noteCard = e.target.closest('[data-note-id]');
  if (noteCard) {
    openEditor(Number(noteCard.dataset.noteId));
    return;
  }

  const chip = e.target.closest('[data-tag-id]');
  if (chip) {
    const raw = chip.dataset.tagId;
    selectedTagId = raw === 'all' ? null : Number(raw);
    renderTagbar();
    renderList();
    return;
  }

  const editorTag = e.target.closest('[data-editor-tag]');
  if (editorTag && editingId != null) {
    toggleManualTag(editingId, Number(editorTag.dataset.editorTag));
    renderAll();
    const tag = state.tags.find((t) => t.id === Number(editorTag.dataset.editorTag));
    const on = state.note_tags.some((r) => r.note_id === editingId && r.tag_id === Number(editorTag.dataset.editorTag));
    editorTag.classList.toggle('on', on);
    return;
  }

  const editTag = e.target.closest('[data-edit-tag]');
  if (editTag) {
    startTagEdit(Number(editTag.dataset.editTag));
    return;
  }

  const delTag = e.target.closest('[data-delete-tag]');
  if (delTag) {
    deleteTag(Number(delTag.dataset.deleteTag));
    return;
  }

  const sidebarTag = e.target.closest('[data-sidebar-tag]');
  if (sidebarTag) {
    selectedTagId = Number(sidebarTag.dataset.sidebarTag);
    renderTagbar();
    renderList();
    refreshTagPanel();
    return;
  }

  const swatch = e.target.closest('[data-swatch]');
  if (swatch) {
    const palette = swatch.closest('.tag-palette');
    if (palette) palette.dataset.color = swatch.dataset.swatch;
    $$('.swatch', swatch.parentElement).forEach((s) => s.classList.toggle('on', s === swatch));
    return;
  }
});

document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest?.('[data-note-id]') && !e.target.closest('button')) {
    e.preventDefault();
    openEditor(Number(e.target.closest('[data-note-id]').dataset.noteId));
    return;
  }
  if (e.key === 'Escape') {
    if ($('#tagDrawerRoot')?.innerHTML) {
      closeTagDrawer();
      return;
    }
    if ($('#modalRoot')?.innerHTML) {
      if (editingId != null && $('#editorText')) saveEditor(); else closeModal();
      tagForm = null;
      return;
    }
    if (searchQuery) {
      setSearch('');
      return;
    }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openSearch();
  }
});

function openSearch() {
  $('#searchWrap')?.classList.remove('hidden');
  setTimeout(() => $('#searchInput')?.focus(), 0);
}

function setSearch(value) {
  searchQuery = value;
  const input = $('#searchInput');
  if (input && input.value !== value) input.value = value;
  $('#searchClear')?.classList.toggle('hidden', !value);
  renderList();
}

$('#searchToggle')?.addEventListener('click', () => {
  openSearch();
});

$('#searchInput')?.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  $('#searchClear').classList.toggle('hidden', !searchQuery);
  searchDebounced();
});

$('#searchClear')?.addEventListener('click', () => {
  setSearch('');
  $('#searchInput').value = '';
  $('#searchInput').focus();
});

$('#layoutToggle')?.addEventListener('click', toggleLayout);
$('#tagsBtn')?.addEventListener('click', openTagsPanel);
$('#settingsBtn')?.addEventListener('click', () => openSettings());

window.addEventListener('resize', () => {
  if ($('#tagDrawerRoot')?.innerHTML && !isDesktop()) closeTagDrawer();
});

$('#sendBtn')?.addEventListener('click', saveFromDock);

$('#pasteBtn')?.addEventListener('click', async () => {
  let text = '';
  try {
    text = await navigator.clipboard.readText();
  } catch {
    showToast('Clipboard access was blocked. Paste into the box instead.');
    return;
  }
  if (!text.trim()) {
    showToast('Clipboard is empty.');
    return;
  }
  const ta = capture();
  const prev = ta && ta.value.trim() ? ta.value.trimEnd() + '\n' : '';
  if (ta) {
    ta.value = prev + text;
    autoGrowCapture();
    ta.focus();
  }
  showToast('Clipboard pasted. Press Enter to save.');
});

$('#capture')?.addEventListener('input', autoGrowCapture);
$('#capture')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    saveFromDock();
  }
});
$('#capture')?.addEventListener('paste', () => setTimeout(autoGrowCapture, 0));

$('#importFile')?.addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  handleImportFile(file);
  e.target.value = '';
});

window.addEventListener('beforeunload', () => saveState(true));

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveState(true);
});

/* ------------------------------------------------------------- self test --- */

function runSelfTests() {
  const results = [];
  const test = (name, fn) => {
    try {
      const value = fn();
      results.push({ name, ok: value !== false, detail: value === true ? '' : String(value ?? '') });
    } catch (e) {
      results.push({ name, ok: false, detail: e?.message || String(e) });
    }
  };

  test('escapeHtml escapes markup', () =>
    escapeHtml(`<b>"x" & 'y'</b>`) === '&lt;b&gt;&quot;x&quot; &amp; &#39;y&#39;&lt;/b&gt;');

  test('truncate adds ellipsis', () => truncate('abcdefghij', 5) === 'abcd…');

  test('normalizeHex accepts int, long and short hex', () =>
    normalizeHex(0x6B8AFF) === '#6B8AFF' &&
    normalizeHex('#6b8aff') === '#6B8AFF' &&
    normalizeHex('#abc') === '#AABBCC');

  test('colorToInt round-trips a hex colour', () =>
    normalizeHex(colorToInt('#4DD0C4')) === '#4DD0C4');

  test('formatInput adds the model prefix', () =>
    formatInput('hello') === MODEL_PREFIX + 'hello');

  test('formatInput caps at 480 characters', () =>
    formatInput('x'.repeat(2000)).length === MAX_INPUT_CHARS);

  test('normalize produces a unit vector', () => {
    const v = normalize(new Float32Array([3, 4]));
    return Math.abs(dot(v, v) - 1) < 1e-6 && Math.abs(v[0] - 0.6) < 1e-6;
  });

  test('cosine is 1 for identical and 0 for orthogonal', () => {
    const a = normalize(new Float32Array([1, 2, 3]));
    const b = normalize(new Float32Array([1, 0, 0]));
    const c = normalize(new Float32Array([0, 1, 0]));
    return Math.abs(cosine(a, a) - 1) < 1e-6 && Math.abs(cosine(b, c)) < 1e-6;
  });

  test('vector base64 round-trips', () => {
    const src = normalize(new Float32Array([0.1, -0.2, 0.3, 0.4]));
    const back = decodeVec(encodeVec(src));
    return back.length === src.length && src.every((x, i) => Math.abs(x - back[i]) < 1e-7);
  });

  test('validateBackup rejects a bad schema', () =>
    validateBackup({ schema_version: 1, notes: [], tags: [] }) === 'Unsupported schema version.');

  test('validateBackup accepts a minimal backup', () =>
    validateBackup({ schema_version: 2, notes: [], tags: [] }) === null);

  test('tagText joins name and description', () =>
    tagText({ name: 'Work', description: 'Job stuff' }) === 'Work: Job stuff');

  test('isUrl recognises links only', () =>
    isUrl('https://example.com/x') === true && isUrl('see https://example.com') === false);

  test('displayDomain strips www', () =>
    displayDomain('https://www.example.com/a') === 'example.com');

  test('clamp keeps values inside the range', () =>
    clamp(0.1, 0.3, 0.9) === 0.3 && clamp(2, 0.3, 0.9) === 0.9);

  test('debounce flushes the last arguments', () => {
    let seen = null;
    const fn = debounce((value) => { seen = value; }, 10);
    fn('first');
    fn('last');
    fn.flush('flushed');
    return seen === 'flushed';
  });

  return results;
}

function showSelfTests() {
  const results = runSelfTests();
  const failed = results.filter((r) => !r.ok).length;
  const panel = document.createElement('div');
  panel.className = 'test-panel';
  panel.innerHTML = `<h2>Self test · ${results.length - failed}/${results.length} passed</h2>` +
    results.map((r) => `<div class="test-row ${r.ok ? 'test-pass' : 'test-fail'}">${r.ok ? 'PASS' : 'FAIL'} — ${escapeHtml(r.name)}${r.detail ? ` <span style="opacity:.6">(${escapeHtml(r.detail)})</span>` : ''}</div>`).join('') +
    `<button id="testClose">Close</button>`;
  document.body.appendChild(panel);
  panel.querySelector('#testClose').onclick = () => panel.remove();
}

/* --------------------------------------------------------------- startup --- */

async function boot() {
  seedFirstRun();
  discardBlankNotes();
  loadVectors();
  await ensureHashes();
  mountTagSidebar();
  renderAll();
  autoGrowCapture();
  const params = new URLSearchParams(location.search);
  const selftest = params.get('selftest') === '1';
  const noModel = params.get('nomodel') === '1' || selftest;
  if (!state.settings.onboardingSeen && !selftest) {
    setTimeout(openOnboarding, 250);
  }
  if (selftest) showSelfTests();
  if (!noModel) {
    // Start the one-time model download immediately; indexing follows on its own.
    setTimeout(() => { autoLoadModel(); }, 500);
  }
}

function deleteWithUndo(id) {
  const n = getNote(id);
  if (!n) return;
  const snap = { note: { ...n }, refs: state.note_tags.filter((r) => r.note_id === id).map((r) => ({ ...r })) };
  deleteNote(id);
  showToast('Note deleted.', [{ label: 'Undo', fn: () => {
    state.notes.push(snap.note);
    state.note_tags.push(...snap.refs);
    saveState(true);
    renderAll();
    enqueueNote(snap.note.id);
  } }], 7000);
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const sheet = $('#modalRoot .sheet');
  if (!sheet) return;
  const f = $$('button,textarea,input,a[href]', sheet).filter((x) => !x.disabled && x.offsetParent);
  if (!f.length) return;
  const a = f[0], z = f[f.length - 1];
  if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
  else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
});

$('#searchInput')?.addEventListener('blur', () => {
  if (!$('#searchInput').value.trim()) setTimeout(() => $('#searchWrap')?.classList.add('hidden'), 150);
});

boot().catch((e) => {
  console.error('Failed to start', e);
  showToast('Something went wrong while starting. Reload the page.');
});
</script>
